<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 中歐旅遊管理系統</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Lucide Icons 簡化版本
        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                Plane: "M3 12l3-3 7 7 6-6 3 3-9 9z M12 2l10 10-10 10L2 12z",
                Plus: "M12 5v14m-7-7h14",
                Trash2: "M3 6h18m-2 0v12a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2",
                Edit3: "M12 20h9m-9-14l4-4 3 3-4 4H9v-3z",
                Save: "M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z",
                X: "M18 6L6 18M6 6l12 12",
                Wallet: "M21 12V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2h14a2 2 0 002-2v-5m-9 0h7",
                Check: "M20 6L9 17l-5-5",
                BarChart3: "M3 3v18h18M8 17V9m4 8V5m4 12v-7",
                MapPin: "M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 110-5 2.5 2.5 0 010 5z",
                Clock: "M12 2a10 10 0 110 20 10 10 0 010-20zm0 5v5l3 3",
                Camera: "M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2v11z M12 15a3 3 0 100-6 3 3 0 000 6z",
                Utensils: "M3 2v7c0 1.1.9 2 2 2h2v11h2V11h2c1.1 0 2-.9 2-2V2M16 2v20m3-15v3",
                CreditCard: "M1 4h22v4H1zm0 8h22v8H1z",
                Snowflake: "M12 2v20m-8.66-5L12 12m0 0l8.66 5M3.34 7L12 12m0 0l8.66-5",
                Info: "M12 2a10 10 0 110 20 10 10 0 010-20zm0 7v5m0 3h.01",
                List: "M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01",
                PieChart: "M21.21 15.89A10 10 0 118 2.83m4-0.83v8h8",
                ExternalLink: "M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6m4-3h6v6m-11 5L21 3",
                AlignLeft: "M17 10H3m14 4H3m14 4H3m18-12H3",
                CheckCircle2: "M12 2a10 10 0 110 20 10 10 0 010-20zm-2 14l-3-3 1.5-1.5L10 13l5.5-5.5L17 9l-7 7z"
            };
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <path d={icons[name] || icons.Info} />
                </svg>
            );
        };

        const CATEGORIES = [
            { id: 'transport', label: '交通', icon: 'Plane', color: 'bg-blue-500' },
            { id: 'accommodation', label: '住宿', icon: 'CreditCard', color: 'bg-indigo-500' },
            { id: 'food', label: '餐飲', icon: 'Utensils', color: 'bg-orange-500' },
            { id: 'sightseeing', label: '景點', icon: 'Camera', color: 'bg-emerald-500' },
            { id: 'ski', label: '滑雪', icon: 'Snowflake', color: 'bg-cyan-500' },
            { id: 'other', label: '其他', icon: 'Info', color: 'bg-slate-500' },
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('itinerary');
            const [items, setItems] = useState(() => {
                const saved = localStorage.getItem('trip-itinerary-v6');
                return saved ? JSON.parse(saved) : [
                    { id: '1', date: '2026-02-20', startTime: '23:35', content: '長榮航空 BR61', location: '桃園機場', amount: 35000, category: 'transport', isPaid: true, link: 'https://www.evaair.com', note: '航廈 T2,提早 3 小時抵達' },
                    { id: '2', date: '2026-03-01', startTime: '08:30', content: 'Dachstein West 滑雪', location: '上特勞恩', amount: 2500, category: 'ski', isPaid: false, link: 'https://www.dachsteinwest.at', note: '租借雪具需攜帶護照' }
                ];
            });

            const [totalBudget, setTotalBudget] = useState(() => {
                const saved = localStorage.getItem('trip-total-budget');
                return saved ? parseFloat(saved) : 150000;
            });

            const [isEditingBudget, setIsEditingBudget] = useState(false);
            const [tempBudget, setTempBudget] = useState(totalBudget);
            const [isEditing, setIsEditing] = useState(false);
            const [editingItem, setEditingItem] = useState(null);
            const [selectedDate, setSelectedDate] = useState(items[0]?.date || '2026-02-20');

            const [formData, setFormData] = useState({
                date: '', startTime: '09:00', endTime: '', content: '', location: '',
                amount: 0, category: 'sightseeing', isPaid: false, link: '', note: ''
            });

            useEffect(() => {
                localStorage.setItem('trip-itinerary-v6', JSON.stringify(items));
            }, [items]);

            useEffect(() => {
                localStorage.setItem('trip-total-budget', totalBudget.toString());
            }, [totalBudget]);

            const sortedDates = useMemo(() => {
                return Array.from(new Set(items.map(i => i.date))).sort();
            }, [items]);

            const filteredItems = useMemo(() => {
                return items.filter(i => i.date === selectedDate).sort((a, b) => a.startTime.localeCompare(b.startTime));
            }, [items, selectedDate]);

            const stats = useMemo(() => {
                const expenseTotal = items.reduce((sum, i) => sum + (Number(i.amount) || 0), 0);
                const byCategory = CATEGORIES.map(cat => ({
                    ...cat,
                    amount: items.filter(i => i.category === cat.id).reduce((sum, i) => sum + (Number(i.amount) || 0), 0)
                }));
                return { expenseTotal, byCategory };
            }, [items]);

            const budgetProgress = useMemo(() => {
                if (totalBudget <= 0) return 0;
                return Math.min((stats.expenseTotal / totalBudget) * 100, 100);
            }, [stats.expenseTotal, totalBudget]);

            const handleOpenEdit = (item = null) => {
                if (item) {
                    setEditingItem(item);
                    setFormData({ ...item });
                } else {
                    setEditingItem(null);
                    setFormData({
                        date: selectedDate, startTime: '09:00', endTime: '', content: '', location: '',
                        amount: 0, category: 'sightseeing', isPaid: false, link: '', note: ''
                    });
                }
                setIsEditing(true);
            };

            const handleSave = () => {
                if (!formData.date || !formData.startTime || !formData.content) {
                    alert('請填寫日期、時間和內容名稱');
                    return;
                }

                const newItem = {
                    id: editingItem?.id || Date.now().toString(),
                    ...formData,
                    amount: parseFloat(formData.amount) || 0
                };

                if (editingItem) {
                    setItems(items.map(i => i.id === editingItem.id ? newItem : i));
                } else {
                    setItems([...items, newItem]);
                }
                setIsEditing(false);
                setSelectedDate(newItem.date);
            };

            return (
                <div className="min-h-screen bg-slate-50 font-sans text-slate-900 pb-32">
                    <header className="bg-white border-b sticky top-0 z-40 px-4 py-5 shadow-sm">
                        <div className="max-w-xl mx-auto">
                            <div className="flex justify-between items-center mb-5">
                                <div className="flex items-center gap-3">
                                    <div className="bg-blue-600 p-2.5 rounded-2xl text-white shadow-lg">
                                        <Icon name="Plane" size={24} />
                                    </div>
                                    <div>
                                        <h1 className="font-black text-xl tracking-tight">2026 Central Europe</h1>
                                        <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Travel Management</p>
                                    </div>
                                </div>
                                <button onClick={() => handleOpenEdit()} className="bg-slate-900 text-white p-3 rounded-full hover:scale-105 transition-transform shadow-lg">
                                    <Icon name="Plus" size={20} />
                                </button>
                            </div>

                            <div className="grid grid-cols-2 gap-4 mb-4">
                                <div className={`p-3 rounded-2xl border transition-all cursor-pointer ${isEditingBudget ? 'bg-white border-blue-500 ring-2 ring-blue-100' : 'bg-slate-50 border-slate-100'}`}
                                     onClick={() => { if(!isEditingBudget) { setTempBudget(totalBudget); setIsEditingBudget(true); }}}>
                                    <p className="text-[10px] font-bold text-slate-400 uppercase mb-1">設定預算總額</p>
                                    {isEditingBudget ? (
                                        <div className="flex items-center gap-2" onClick={e => e.stopPropagation()}>
                                            <span className="font-black text-lg text-blue-600">$</span>
                                            <input autoFocus type="number" value={tempBudget} 
                                                   onChange={e => setTempBudget(e.target.value)}
                                                   onBlur={() => { setTotalBudget(parseFloat(tempBudget) || 0); setIsEditingBudget(false); }}
                                                   className="w-full bg-transparent border-none p-0 font-black text-lg text-blue-600" />
                                        </div>
                                    ) : (
                                        <p className="font-black text-lg text-slate-800">${totalBudget.toLocaleString()}</p>
                                    )}
                                </div>
                                <div className="bg-indigo-50 p-3 rounded-2xl border border-indigo-100">
                                    <p className="text-[10px] font-bold text-indigo-500 uppercase mb-1">目前總支出</p>
                                    <p className="font-black text-lg text-indigo-700">${stats.expenseTotal.toLocaleString()}</p>
                                </div>
                            </div>

                            <div className="relative w-full bg-slate-100 h-2.5 rounded-full overflow-hidden mb-1">
                                <div className={`h-full transition-all duration-700 ${budgetProgress > 90 ? 'bg-red-500' : 'bg-blue-500'}`} style={{width: `${budgetProgress}%`}} />
                            </div>
                            <div className="flex justify-between px-1">
                                <span className="text-[9px] font-black text-slate-400">已支出: {Math.round(budgetProgress)}%</span>
                                <span className="text-[9px] font-black text-slate-400">剩餘: ${(totalBudget - stats.expenseTotal).toLocaleString()}</span>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-xl mx-auto p-4">
                        {activeTab === 'itinerary' ? (
                            <div className="space-y-6">
                                <div className="flex gap-3 overflow-x-auto pb-2 no-scrollbar">
                                    {sortedDates.map(d => (
                                        <button key={d} onClick={() => setSelectedDate(d)}
                                                className={`flex-shrink-0 flex flex-col items-center justify-center w-14 h-20 rounded-2xl transition-all ${
                                                    selectedDate === d ? 'bg-blue-600 text-white shadow-lg' : 'bg-white text-slate-400 border'
                                                }`}>
                                            <span className="text-[9px] font-black opacity-70 mb-1">DAY</span>
                                            <span className="text-lg font-black">{d.split('-')[2]}</span>
                                            <span className="text-[8px] font-bold opacity-60 mt-1">{d.split('-')[1]}月</span>
                                        </button>
                                    ))}
                                </div>

                                <div className="space-y-4">
                                    {filteredItems.map(item => {
                                        const category = CATEGORIES.find(c => c.id === item.category);
                                        return (
                                            <div key={item.id} className="bg-white rounded-3xl p-5 border shadow-sm">
                                                <div className="flex gap-4">
                                                    <div className={`flex-shrink-0 w-12 h-12 rounded-2xl flex items-center justify-center text-white ${category?.color}`}>
                                                        <Icon name={category?.icon} size={20} />
                                                    </div>
                                                    <div className="flex-1 min-w-0">
                                                        <div className="flex justify-between items-start mb-2">
                                                            <div className="flex items-center gap-1 bg-slate-100 px-2 py-0.5 rounded-lg">
                                                                <Icon name="Clock" size={10} />
                                                                <span className="text-[10px] font-black text-slate-600">{item.startTime}</span>
                                                            </div>
                                                            <div className="flex gap-2">
                                                                <button onClick={() => handleOpenEdit(item)} className="text-slate-300 hover:text-blue-500">
                                                                    <Icon name="Edit3" size={14} />
                                                                </button>
                                                                <button onClick={() => { if(confirm('確定刪除?')) setItems(items.filter(i => i.id !== item.id)); }} className="text-slate-300 hover:text-red-500">
                                                                    <Icon name="Trash2" size={14} />
                                                                </button>
                                                            </div>
                                                        </div>
                                                        <h3 className="font-bold text-slate-800 mb-1">{item.content}</h3>
                                                        <div className="flex items-center gap-1.5 text-xs text-slate-400 mb-2">
                                                            <Icon name="MapPin" size={12} /> {item.location}
                                                        </div>
                                                        {item.link && (
                                                            <a href={item.link} target="_blank" className="inline-flex items-center gap-1 text-[10px] font-bold text-blue-500 bg-blue-50 px-2 py-1 rounded-lg mb-3">
                                                                <Icon name="ExternalLink" size={10} /> 相關連結
                                                            </a>
                                                        )}
                                                        {item.note && (
                                                            <div className="bg-slate-50 rounded-xl p-3 mb-3 border">
                                                                <p className="text-[10px] font-bold text-slate-400 uppercase mb-1">備註</p>
                                                                <p className="text-xs text-slate-600">{item.note}</p>
                                                            </div>
                                                        )}
                                                        <div className="flex items-center justify-between pt-3 border-t">
                                                            <span className="font-black text-slate-700">${item.amount.toLocaleString()}</span>
                                                            <div className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${item.isPaid ? 'bg-emerald-50 text-emerald-600' : 'bg-orange-50 text-orange-600'}`}>
                                                                {item.isPaid ? '已付' : '未付'}
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        ) : (
                            <div className="space-y-6 pb-10">
                                <div className="bg-white rounded-3xl p-6 border shadow-sm">
                                    <h3 className="font-black text-slate-800 mb-6 flex items-center gap-2">
                                        <Icon name="BarChart3" size={18} className="text-blue-600" /> 類別支出統計
                                    </h3>
                                    <div className="grid grid-cols-2 gap-4">
                                        {stats.byCategory.filter(c => c.amount > 0).map(cat => (
                                            <div key={cat.id} className="flex items-center gap-3 bg-slate-50 p-3 rounded-2xl border">
                                                <div className={`w-8 h-8 rounded-xl ${cat.color} flex items-center justify-center text-white`}>
                                                    <Icon name={cat.icon} size={16} />
                                                </div>
                                                <div>
                                                    <p className="text-[10px] font-bold text-slate-400 uppercase">{cat.label}</p>
                                                    <p className="font-black text-sm">${cat.amount.toLocaleString()}</p>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    <nav className="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-xl border-t px-8 py-4 z-50 shadow-lg">
                        <div className="max-w-xl mx-auto flex justify-between">
                            <button onClick={() => setActiveTab('itinerary')} className={`flex flex-col items-center gap-1 ${activeTab === 'itinerary' ? 'text-blue-600' : 'text-slate-400'}`}>
                                <Icon name="List" size={20} />
                                <span className="text-[10px] font-black uppercase">行程規劃</span>
                            </button>
                            <button onClick={() => setActiveTab('budget')} className={`flex flex-col items-center gap-1 ${activeTab === 'budget' ? 'text-blue-600' : 'text-slate-400'}`}>
                                <Icon name="PieChart" size={20} />
                                <span className="text-[10px] font-black uppercase">費用分析</span>
                            </button>
                        </div>
                    </nav>

                    {isEditing && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden">
                                <div className="p-6 border-b flex justify-between items-center bg-slate-50">
                                    <h2 className="font-black text-lg">{editingItem ? '編輯行程' : '新增行程'}</h2>
                                    <button onClick={() => setIsEditing(false)} className="p-2 hover:bg-slate-200 rounded-full">
                                        <Icon name="X" size={20} />
                                    </button>
                                </div>

                                <div className="p-6 space-y-4 max-h-[70vh] overflow-y-auto">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">日期 *</label>
                                            <input type="date" value={formData.date} onChange={e => setFormData({...formData, date: e.target.value})} className="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-bold" />
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">時間 *</label>
                                            <input type="time" value={formData.startTime} onChange={e => setFormData({...formData, startTime: e.target.value})} className="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-bold" />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">內容名稱 *</label>
                                        <input type="text" placeholder="例如:新天鵝堡" value={formData.content} onChange={e => setFormData({...formData, content: e.target.value})} className="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-bold" />
                                    </div>

                                    <div>
                                        <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">地點</label>
                                        <input type="text" placeholder="城市或地址" value={formData.location} onChange={e => setFormData({...formData, location: e.target.value})} className="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-bold" />
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">金額</label>
                                            <input type="number" value={formData.amount} onChange={e => setFormData({...formData, amount: e.target.value})} className="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-black" />
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">類別</label>
                                            <select value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})} className="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-bold">
                                                {CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
                                            </select>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">連結</label>
                                        <input type="url" placeholder="https://..." value={formData.link} onChange={e => setFormData({...formData, link: e.target.value})} className="w-full bg-slate-50 border-none rounded-xl p-3 text-xs font-bold" />
                                    </div>

                                    <div>
                                        <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">備註</label>
                                        <textarea rows="3" placeholder="行程備註..." value={formData.note} onChange={e => setFormData({...formData, note: e.target.value})} className="w-full bg-slate-50 border-none rounded-xl p-3 text-xs font-bold resize-none" />
                                    </div>

                                    <div className="flex items-center gap-2 p-3 bg-slate-50 rounded-xl">
                                        <input type="checkbox" checked={formData.isPaid} onChange={e => setFormData({...formData, isPaid: e.target.checked})} className="w-4 h-4 rounded text-blue-600" id="paid" />
                                        <label htmlFor="paid" className="text-xs font-bold text-slate-600 cursor-pointer">標記為已支付</label>
                                    </div>

                                    <button onClick={handleSave} className="w-full bg-slate-900 text-white font-black py-4 rounded-2xl shadow-lg hover:bg-black transition-all flex items-center justify-center gap-2">
                                        <Icon name="Save" size={18} /> 儲存行程
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
